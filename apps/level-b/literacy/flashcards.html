<main id="main" class="shell flashcard-page"><header class="hero center"><h1 class="title">Review Flashcards</h1><p class="note">Tap a flashcard to hear its word and sentence.</p><p class="fc-status" data-audio-status role="status"></p></header>
<div class="fc-layout"><nav class="fc-tabs" aria-label="Flashcard activities">
<button class="fc-tab is-active" type="button" data-tab="lesson" aria-pressed="true">📚 Lesson Flashcards</button><button class="fc-tab" type="button" data-tab="fast" aria-pressed="false">⚡ Fast Game</button><button class="fc-tab" type="button" data-tab="spot" aria-pressed="false">🔦 Spot the Picture</button><button class="fc-tab" type="button" data-tab="sentence" aria-pressed="false">🧩 Complete the Sentence</button><button class="fc-tab" type="button" data-tab="tpr" aria-pressed="false">🎬 TPR</button></nav>
<section class="fc-workbench card"><div class="fc-panel is-active" data-panel="lesson"><button class="fc-feature" type="button" data-feature-card aria-label="Hear this flashcard"></button><p class="fc-model" data-model-sentence></p><div class="fc-controls"><button class="fc-action" data-prev>← Previous</button><button class="fc-action" data-listen>🔊 Listen</button><button class="fc-action" data-next>Next →</button><button class="fc-action" data-shuffle>🎲 Shuffle</button></div><p class="fc-status" data-card-count></p><div class="fc-thumbs" data-card-list></div></div>
<div class="fc-panel" data-panel="fast" hidden><h2>Fast Game</h2><div class="fc-fast-stage" data-fast-stage><div class="fc-curtain">?</div></div><div class="fc-controls"><button class="fc-action" type="button" data-fast-peek>Peek (0.3 sec)</button><button class="fc-action" type="button" data-fast-show>Show Full</button><button class="fc-action" type="button" data-fast-new>New Flashcard</button></div></div>
<div class="fc-panel" data-panel="spot" hidden><h2>Spot the Picture</h2><div class="fc-spot-stage" data-spot-stage tabindex="0" aria-label="Hidden flashcard. Move the spotlight to see it."></div><div class="fc-controls"><button class="fc-action" type="button" data-spot-reveal>Show Full Picture</button><button class="fc-action" type="button" data-spot-new>New Flashcard</button></div></div>
<div class="fc-panel" data-panel="sentence" hidden><h2>Complete the Sentence</h2><div class="fc-sentence">Word: <span class="fc-blank" data-sentence-blank tabindex="0">______</span>.</div><div class="fc-scatter" data-sentence-choices aria-label="Drag or tap a flashcard into the sentence"></div><p class="fc-status" data-sentence-status aria-live="polite">Drag or tap any card into the blank.</p><div class="fc-controls"><button class="fc-action" type="button" data-sentence-new>Try Again</button></div></div><div class="fc-panel" data-panel="tpr" hidden><p role="status">Preparing your action cards…</p></div></main><script src="flashcard-data.js?v=83fc6bb2f400"></script><script src="flashcards.js?v=f8212c2721eb"></script></body></html>
